<div id="stage" style="position:relative;overflow:hidden;min-height:520px;background:#000;border-radius:12px;padding:20px 0;">
<style>
@keyframes rainbow{0%{color:#ff0055}16%{color:#ff9500}33%{color:#ffee00}50%{color:#22ff00}66%{color:#00d9ff}83%{color:#9d00ff}100%{color:#ff0055}}
@keyframes shake{0%,100%{transform:translate(0,0) rotate(0deg)}10%{transform:translate(-6px,4px) rotate(-2deg)}20%{transform:translate(5px,-5px) rotate(2deg)}30%{transform:translate(-4px,3px) rotate(-1deg)}40%{transform:translate(6px,-2px) rotate(1deg)}50%{transform:translate(-3px,5px) rotate(-2deg)}60%{transform:translate(4px,-4px) rotate(2deg)}70%{transform:translate(-5px,2px) rotate(-1deg)}80%{transform:translate(3px,-3px) rotate(1deg)}90%{transform:translate(-2px,4px) rotate(-1deg)}}
@keyframes zoom{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}
@keyframes spin360{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes bgflash{0%{background:#ff0055}20%{background:#ff9500}40%{background:#ffee00}60%{background:#22ff00}80%{background:#00d9ff}100%{background:#9d00ff}}
@keyframes floatUp{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(-600px) rotate(720deg);opacity:0}}
@keyframes wobble{0%,100%{transform:skewX(0deg)}25%{transform:skewX(8deg)}75%{transform:skewX(-8deg)}}
.title{font-size:44px;font-weight:900;text-align:center;animation:rainbow 1.2s linear infinite,shake 0.3s infinite,wobble 0.5s infinite;text-shadow:0 0 20px currentColor,0 0 40px currentColor;letter-spacing:2px;font-family:sans-serif;margin:0;}
.sub{text-align:center;font-size:20px;color:#fff;animation:rainbow 0.8s linear infinite reverse;font-weight:900;margin-top:10px;font-family:sans-serif;}
.blob{position:absolute;font-size:40px;animation:floatUp 4s linear infinite;}
.cake{font-size:100px;text-align:center;display:block;animation:zoom 0.6s ease-in-out infinite,spin360 3s linear infinite;filter:drop-shadow(0 0 20px yellow);}
.btn{display:block;margin:24px auto 0;padding:18px 36px;font-size:22px;font-weight:900;color:#000;background:#fff;border:6px solid #000;border-radius:50px;cursor:pointer;animation:zoom 0.4s infinite,bgflash 1s linear infinite;box-shadow:0 0 30px rgba(255,255,255,0.8);font-family:sans-serif;}
.msg{text-align:center;color:#fff;font-size:16px;margin-top:14px;font-family:sans-serif;min-height:24px;font-weight:700;}
</style>
<h2 style="position:absolute;left:-9999px;">画面が激しく点滅・振動する誕生日祝いページ。中央のケーキをクリックすると絵文字が舞い上がる。</h2>
<div id="blobwrap" style="position:absolute;inset:0;pointer-events:none;"></div>
<span class="cake" id="cake">🎂</span>
<h1 class="title">誕生日おめでとおおおおおおお</h1>
<div class="sub">HAPPY BIRTHDAY TO YOOOOOU 🎉🎂🎉</div>
<button class="btn" id="btn">押すと更にヤバくなる</button>
<div class="msg" id="msg"></div>
</div>
<script>
const wrap=document.getElementById('blobwrap');
const emojis=['🎉','🎈','🎊','✨','🥳','🍰','🎁','⭐'];
function spawn(n){
for(let i=0;i<n;i++){
const b=document.createElement('div');
b.className='blob';
b.textContent=emojis[Math.floor(Math.random()*emojis.length)];
b.style.left=Math.random()*95+'%';
b.style.bottom='0px';
b.style.fontSize=(20+Math.random()*40)+'px';
b.style.animationDuration=(2+Math.random()*3)+'s';
b.style.animationDelay=(Math.random()*1)+'s';
wrap.appendChild(b);
setTimeout(()=>b.remove(),6000);
}
}
spawn(15);
setInterval(()=>spawn(3),700);
const msgs=['もう誰にも止められない','限界突破おめでとう','宇宙一やばい誕生日','脳が破壊された','なにかがおかしい'];
let count=0;
document.getElementById('cake').onclick=()=>spawn(30);
document.getElementById('btn').onclick=()=>{
spawn(40);
count++;
document.getElementById('msg').textContent=msgs[count%msgs.length];
document.getElementById('stage').style.animation='shake 0.15s infinite';
};
</script>
